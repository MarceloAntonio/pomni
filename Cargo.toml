[package]
name = "pomni"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Controle independente de iluminação RGB para teclados compatíveis no Linux"
license = "MIT"
repository = "https://github.com/MarceloAntonio/pomni"

default-run = "pomni"

[dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence"] }

[features]
gui = ["dep:eframe"]

[[bin]]
name = "pomni-gui"
path = "src/bin/pomni-gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
